name: Import WorldStructures Assets

on:
  push:
    branches: ["feature/worldstructures-elite-bosses"]
    paths:
      - ".github/workflows/import-worldstructures-assets.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          ref: feature/worldstructures-elite-bosses
          fetch-depth: 0

      - name: Checkout MIT structure source
        uses: actions/checkout@v4
        with:
          repository: Thun-bit/thunstructures
          path: _thunstructures

      - name: Copy selected NBT templates
        run: |
          set -euo pipefail
          mkdir -p WorldStructures/src/main/resources/structures
          for name in campsite castle graveyard lighthouse observatory ship windmill ice_castle; do
            cp "_thunstructures/data/thunstructures/structure/${name}.nbt" \
               "WorldStructures/src/main/resources/structures/${name}.nbt"
          done

      - name: Commit imported templates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorldStructures/src/main/resources/structures/*.nbt
          if git diff --cached --quiet; then
            echo "NBT templates already present"
            exit 0
          fi
          git commit -m "Bundle MIT structure NBT templates"
          git push origin HEAD:feature/worldstructures-elite-bosses
