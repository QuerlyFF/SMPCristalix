name: Import WorldStructures NBT assets

on:
  push:
    branches: ["feature/worldstructures-elite-bosses"]
    paths:
      - ".github/workflows/import-worldstructures-assets.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: feature/worldstructures-elite-bosses
          fetch-depth: 0

      - name: Checkout Thun's Structures (MIT)
        uses: actions/checkout@v4
        with:
          repository: Thun-bit/thunstructures
          path: .tmp-thunstructures

      - name: Copy curated NBT templates and license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p WorldStructures/src/main/resources/structures
          mkdir -p WorldStructures/third-party/thunstructures

          for name in campsite castle graveyard lighthouse observatory ship windmill ice_castle; do
            cp ".tmp-thunstructures/data/thunstructures/structure/${name}.nbt" \
               "WorldStructures/src/main/resources/structures/${name}.nbt"
          done

          cp .tmp-thunstructures/LICENSE WorldStructures/third-party/thunstructures/LICENSE
          cat > WorldStructures/third-party/thunstructures/ATTRIBUTION.md <<'EOF'
          # Thun's Structures assets

          Selected structure templates in `src/main/resources/structures/` originate from
          `Thun-bit/thunstructures` and are redistributed/modified under the MIT License.

          Imported templates:
          - campsite.nbt
          - castle.nbt
          - graveyard.nbt
          - lighthouse.nbt
          - observatory.nbt
          - ship.nbt
          - windmill.nbt
          - ice_castle.nbt

          Source: https://github.com/Thun-bit/thunstructures
          EOF

          rm -rf .tmp-thunstructures
          rm -f .github/workflows/import-worldstructures-assets.yml

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorldStructures/src/main/resources/structures WorldStructures/third-party .github/workflows/import-worldstructures-assets.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import licensed NBT structure templates"
          git push origin HEAD:feature/worldstructures-elite-bosses
