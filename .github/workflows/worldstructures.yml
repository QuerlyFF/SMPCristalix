name: Build WorldStructures

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "WorldStructures/**"
      - ".github/workflows/worldstructures.yml"
  pull_request:
    branches: [main]
    paths:
      - "WorldStructures/**"
      - ".github/workflows/worldstructures.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: WorldStructures/pom.xml

      - name: Build
        working-directory: WorldStructures
        run: mvn -B clean verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: WorldStructures
          path: WorldStructures/target/WorldStructures.jar
          if-no-files-found: error
