name: Build VanillaBalance

on:
  push:
    paths:
      - 'VanillaBalance/**'
      - '.github/workflows/vanillabalance.yml'
  pull_request:
    paths:
      - 'VanillaBalance/**'
      - '.github/workflows/vanillabalance.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: VanillaBalance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: VanillaBalance/pom.xml
      - name: Verify and test
        run: mvn -B --no-transfer-progress clean verify
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: VanillaBalance-jar
          path: VanillaBalance/target/VanillaBalance.jar
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VanillaBalance-test-reports
          path: VanillaBalance/target/surefire-reports
          if-no-files-found: ignore
